# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with the app's APK.
android.useAndroidX=true

# AGP 9 enables built-in Kotlin support by default. The org.jetbrains.kotlin.android
# plugin must NOT be applied; see app/build.gradle.kts.
android.builtInKotlin=true

# Only build the resources for the variants being built.
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Override non-ASCII path check on Windows
android.overridePathCheck=true

# Run Kotlin compiler in-process to avoid daemon connection issues with non-ASCII paths
kotlin.compiler.execution.strategy=in-process
